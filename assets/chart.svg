<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Animated line chart of monthly active users">
<title>Monthly active users</title>
<defs>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .t { font: 700 18px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f1f5f9; }
  .s { font: 500 13px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
  .axis { font: 500 12px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748b; }
  .grid { stroke: #ffffff12; stroke-dasharray: 3 5; }
  .line { fill: none; stroke: url(#line); stroke-width: 3.5; stroke-linecap: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 30% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .area { animation: fade 9s ease infinite; }
  @keyframes fade { 0%, 22% { opacity: 0; } 38%, 88% { opacity: 1; } 100% { opacity: 0; } }
  .dot { fill: #0b1222; stroke: #c4b5fd; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pop 9s ease infinite both; }
  @keyframes pop { 0% { transform: scale(0); } 6% { transform: scale(1.5); } 10%, 88% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  .live { transform-box: fill-box; transform-origin: center; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.5); opacity: 0; } }
  .callout { animation: fade 9s ease infinite; }
  .cv { font: 800 22px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f1f5f9; }
  .cd { font: 700 12px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4ade80; }
</style>
<rect width="900" height="330" rx="20" fill="#0b1222"/>
<text x="32" y="42" class="t">Monthly active users</text>
<text x="32" y="62" class="s">The line draws itself, then the area and points follow</text>
<line x1="70" x2="860" y1="280.0" y2="280.0" class="grid"/><text x="56" y="284.0" class="axis" text-anchor="end">0k</text><line x1="70" x2="860" y1="213.3" y2="213.3" class="grid"/><text x="56" y="217.3" class="axis" text-anchor="end">20k</text><line x1="70" x2="860" y1="146.7" y2="146.7" class="grid"/><text x="56" y="150.7" class="axis" text-anchor="end">40k</text><line x1="70" x2="860" y1="80.0" y2="80.0" class="grid"/><text x="56" y="84.0" class="axis" text-anchor="end">60k</text><text x="70.0" y="304" class="axis" text-anchor="middle">Jan</text><text x="141.8" y="304" class="axis" text-anchor="middle">Feb</text><text x="213.6" y="304" class="axis" text-anchor="middle">Mar</text><text x="285.5" y="304" class="axis" text-anchor="middle">Apr</text><text x="357.3" y="304" class="axis" text-anchor="middle">May</text><text x="429.1" y="304" class="axis" text-anchor="middle">Jun</text><text x="500.9" y="304" class="axis" text-anchor="middle">Jul</text><text x="572.7" y="304" class="axis" text-anchor="middle">Aug</text><text x="644.5" y="304" class="axis" text-anchor="middle">Sep</text><text x="716.4" y="304" class="axis" text-anchor="middle">Oct</text><text x="788.2" y="304" class="axis" text-anchor="middle">Nov</text><text x="860.0" y="304" class="axis" text-anchor="middle">Dec</text>
<path class="area" d="M70.0,240.0 C82.0,238.3 117.9,231.1 141.8,230.0 C165.8,228.9 189.7,236.7 213.6,233.3 C237.6,230.0 261.5,215.6 285.5,210.0 C309.4,204.4 333.3,201.1 357.3,200.0 C381.2,198.9 405.2,207.2 429.1,203.3 C453.0,199.4 477.0,183.9 500.9,176.7 C524.8,169.4 548.8,161.7 572.7,160.0 C596.7,158.3 620.6,170.0 644.5,166.7 C668.5,163.3 692.4,147.2 716.4,140.0 C740.3,132.8 764.2,128.9 788.2,123.3 C812.1,117.8 848.0,109.4 860.0,106.7 L860.0,280 L70.0,280 Z" fill="url(#area)"/>
<path class="line" d="M70.0,240.0 C82.0,238.3 117.9,231.1 141.8,230.0 C165.8,228.9 189.7,236.7 213.6,233.3 C237.6,230.0 261.5,215.6 285.5,210.0 C309.4,204.4 333.3,201.1 357.3,200.0 C381.2,198.9 405.2,207.2 429.1,203.3 C453.0,199.4 477.0,183.9 500.9,176.7 C524.8,169.4 548.8,161.7 572.7,160.0 C596.7,158.3 620.6,170.0 644.5,166.7 C668.5,163.3 692.4,147.2 716.4,140.0 C740.3,132.8 764.2,128.9 788.2,123.3 C812.1,117.8 848.0,109.4 860.0,106.7" pathLength="1" filter="url(#glow)"/>
<circle class="dot" style="animation-delay:0.25s" cx="70.0" cy="240.0" r="4.5"/><circle class="dot" style="animation-delay:0.41s" cx="141.8" cy="230.0" r="4.5"/><circle class="dot" style="animation-delay:0.57s" cx="213.6" cy="233.3" r="4.5"/><circle class="dot" style="animation-delay:0.73s" cx="285.5" cy="210.0" r="4.5"/><circle class="dot" style="animation-delay:0.89s" cx="357.3" cy="200.0" r="4.5"/><circle class="dot" style="animation-delay:1.05s" cx="429.1" cy="203.3" r="4.5"/><circle class="dot" style="animation-delay:1.21s" cx="500.9" cy="176.7" r="4.5"/><circle class="dot" style="animation-delay:1.37s" cx="572.7" cy="160.0" r="4.5"/><circle class="dot" style="animation-delay:1.53s" cx="644.5" cy="166.7" r="4.5"/><circle class="dot" style="animation-delay:1.69s" cx="716.4" cy="140.0" r="4.5"/><circle class="dot" style="animation-delay:1.85s" cx="788.2" cy="123.3" r="4.5"/><circle class="dot" style="animation-delay:2.01s" cx="860.0" cy="106.7" r="4.5"/>
<circle class="live" cx="860.0" cy="106.7" r="5" fill="#f472b6"/>
<g class="callout" transform="translate(610.0 94.7)">
  <rect width="100" height="48" rx="10" fill="#1e293b" stroke="#ffffff1f"/>
  <text x="12" y="23" class="cv">52k</text>
  <text x="12" y="39" class="cd">▲ 33% YoY</text>
</g>
</svg>
