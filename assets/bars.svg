<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Animated progress bars">
<title>Markdown superpowers</title>
<defs>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><clipPath id="c0"><rect x="210" y="74" width="570" height="14" rx="7"/></clipPath><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb7185"/></linearGradient><clipPath id="c1"><rect x="210" y="120" width="510" height="14" rx="7"/></clipPath><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><clipPath id="c2"><rect x="210" y="166" width="480" height="14" rx="7"/></clipPath><linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><clipPath id="c3"><rect x="210" y="212" width="420" height="14" rx="7"/></clipPath><linearGradient id="g4" x1="0" x2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><clipPath id="c4"><rect x="210" y="258" width="360" height="14" rx="7"/></clipPath>
</defs>
<style>
  .h { font: 700 18px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f1f5f9; }
  .lbl { font: 600 14px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; }
  .pct { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f1f5f9; animation: show 7s ease infinite both; }
  .fill { transform-box: fill-box; transform-origin: left; animation: fill 7s cubic-bezier(.22,1,.36,1) infinite both; }
  @keyframes fill { 0% { transform: scaleX(0); } 20% { transform: scaleX(1); } 90% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes show { 0%, 12% { opacity: 0; } 22%, 90% { opacity: 1; } 100% { opacity: 0; } }
  .shine { animation: shine 7s ease-in-out infinite both; }
  @keyframes shine { 0%, 20% { transform: translateX(0); } 45%, 100% { transform: translateX(760px); } }
</style>
<rect width="900" height="310" rx="20" fill="#0b1222"/>
<text x="40" y="44" class="h">Markdown superpowers</text>

  <text x="40" y="86" class="lbl">Diagrams</text>
  <rect x="210" y="74" width="600" height="14" rx="7" fill="#ffffff0f"/>
  <rect class="fill" style="animation-delay:0.00s" x="210" y="74" width="570" height="14" rx="7" fill="url(#g0)"/>
  <g clip-path="url(#c0)"><rect class="shine" style="animation-delay:1.40s" x="90" y="74" width="90" height="14" fill="url(#shine)"/></g>
  <text class="pct" style="animation-delay:0.90s" x="830" y="86">95%</text>
  <text x="40" y="132" class="lbl">Math &amp; color</text>
  <rect x="210" y="120" width="600" height="14" rx="7" fill="#ffffff0f"/>
  <rect class="fill" style="animation-delay:0.18s" x="210" y="120" width="510" height="14" rx="7" fill="url(#g1)"/>
  <g clip-path="url(#c1)"><rect class="shine" style="animation-delay:1.58s" x="90" y="120" width="90" height="14" fill="url(#shine)"/></g>
  <text class="pct" style="animation-delay:1.08s" x="830" y="132">85%</text>
  <text x="40" y="178" class="lbl">Animation</text>
  <rect x="210" y="166" width="600" height="14" rx="7" fill="#ffffff0f"/>
  <rect class="fill" style="animation-delay:0.36s" x="210" y="166" width="480" height="14" rx="7" fill="url(#g2)"/>
  <g clip-path="url(#c2)"><rect class="shine" style="animation-delay:1.76s" x="90" y="166" width="90" height="14" fill="url(#shine)"/></g>
  <text class="pct" style="animation-delay:1.26s" x="830" y="178">80%</text>
  <text x="40" y="224" class="lbl">Interactivity</text>
  <rect x="210" y="212" width="600" height="14" rx="7" fill="#ffffff0f"/>
  <rect class="fill" style="animation-delay:0.54s" x="210" y="212" width="420" height="14" rx="7" fill="url(#g3)"/>
  <g clip-path="url(#c3)"><rect class="shine" style="animation-delay:1.94s" x="90" y="212" width="90" height="14" fill="url(#shine)"/></g>
  <text class="pct" style="animation-delay:1.44s" x="830" y="224">70%</text>
  <text x="40" y="270" class="lbl">Portability</text>
  <rect x="210" y="258" width="600" height="14" rx="7" fill="#ffffff0f"/>
  <rect class="fill" style="animation-delay:0.72s" x="210" y="258" width="360" height="14" rx="7" fill="url(#g4)"/>
  <g clip-path="url(#c4)"><rect class="shine" style="animation-delay:2.12s" x="90" y="258" width="90" height="14" fill="url(#shine)"/></g>
  <text class="pct" style="animation-delay:1.62s" x="830" y="270">60%</text>
</svg>
